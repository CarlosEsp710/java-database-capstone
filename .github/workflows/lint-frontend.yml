name: Lint Frontend

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test app/src/test/js/services.test.mjs
