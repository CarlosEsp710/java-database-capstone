<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Clinic | Select Your Role</title>
    <link rel="icon" type="image/png" href="/assets/images/logo/logo.png">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/index.css">
    <script src="/js/util.js" defer></script>
    <script src="/js/render.js" defer></script>
    <script src="/js/components/header.js" defer></script>
    <script src="/js/components/footer.js" defer></script>
    <script type="module" src="/js/services/index.js"></script>
</head>
<body>
<div class="container">
    <div class="wrapper">
        <div id="header"></div>
        <main class="main-content">
            <h1>Select Your Role</h1>
            <p>Choose how you would like to use Smart Clinic.</p>
            <div class="role-actions">
                <button id="adminLogin" type="button">Admin</button>
                <button id="doctorLogin" type="button">Doctor</button>
                <button id="patientRole" type="button">Patient</button>
            </div>
        </main>
        <div id="footer"></div>
    </div>
</div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Login" aria-hidden="true">
    <div class="modal-content">
        <button id="closeModal" class="close" type="button" aria-label="Close dialog">&times;</button>
        <div id="modal-body"></div>
    </div>
</div>
</body>
</html>
