<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doctor Dashboard | Smart Clinic</title>
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
    <script type="module" th:src="@{/js/doctorDashboard.js}"></script>
</head>
<body onload="renderContent()">
<div class="container">
    <div class="wrapper">
        <div id="header"></div>
        <main class="main-content">
            <h1>Patient Appointments</h1>
            <input type="search" id="searchBar" class="searchBar" placeholder="Search by patient name" aria-label="Search by patient name">
            <div class="filter-wrapper">
                <button type="button" id="todayButton" class="today-btn">Today's appointments</button>
                <input type="date" id="datePicker" class="date-picker" aria-label="Appointment date">
            </div>
            <div class="table-scroll">
                <table id="patientTable">
                    <thead><tr><th>Patient ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Prescription</th></tr></thead>
                    <tbody id="patientTableBody"></tbody>
                </table>
            </div>
        </main>
        <div id="footer"></div>
    </div>
</div>
</body>
</html>
