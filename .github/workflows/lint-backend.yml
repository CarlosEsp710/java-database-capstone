name: Lint Java Backend

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Checkstyle
        run: curl --fail --location --retry 3 --output checkstyle.jar https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.21.4/checkstyle-10.21.4-all.jar
      - name: Lint Java sources
        run: java -jar checkstyle.jar -c .github/checkstyle.xml app/src/main/java/com/project/back_end
