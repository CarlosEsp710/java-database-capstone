<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard | Smart Clinic</title>
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
    <script type="module" th:src="@{/js/adminDashboard.js}"></script>
</head>
<body onload="renderContent()">
<div class="container">
    <div class="wrapper">
        <div id="header"></div>
        <main class="main-content">
            <h1>Manage Doctors</h1>
            <input type="search" id="searchBar" class="searchBar" placeholder="Search by doctor name" aria-label="Search by doctor name">
            <div class="filter-wrapper">
                <select id="filterTime" class="filter-select" aria-label="Filter by time">
                    <option value="">All times</option>
                    <option value="AM">Morning</option>
                    <option value="PM">Afternoon</option>
                </select>
                <select id="filterSpecialty" class="filter-select" aria-label="Filter by specialty">
                    <option value="">All specialties</option>
                    <option value="Cardiology">Cardiology</option>
                    <option value="Neurology">Neurology</option>
                    <option value="Orthopedics">Orthopedics</option>
                    <option value="Pediatrics">Pediatrics</option>
                    <option value="Dermatology">Dermatology</option>
                </select>
            </div>
            <div id="content" aria-live="polite"></div>
        </main>
        <div id="footer"></div>
    </div>
</div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Add doctor" aria-hidden="true">
    <div class="modal-content">
        <button id="closeModal" class="close" type="button" aria-label="Close dialog">&times;</button>
        <div id="modal-body"></div>
    </div>
</div>
</body>
</html>
